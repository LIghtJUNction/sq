[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sq-system-one"
version = "0.1.0"
description = "Typed Python SDK for sq and System One decision APIs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "LIghtJUNction"}]
dependencies = ["httpx>=0.28,<1"]
keywords = ["system-one", "jev", "drex", "laya", "decisions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/LIghtJUNction/sq"
Issues = "https://github.com/LIghtJUNction/sq/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11", "mypy>=1.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/systemone_sq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
