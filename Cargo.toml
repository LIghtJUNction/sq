[package]
name = "sq-system-one"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Streaming System One decisions for shell pipelines"
license = "MIT"
repository = "https://github.com/LIghtJUNction/sq"
readme = "README.md"

[lib]
name = "sq_system_one"

[[bin]]
name = "sq"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
csv-core = "0.1"
dirs = "6"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "signal", "sync", "time"] }
toml = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
