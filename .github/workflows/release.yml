name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check tag and package versions
        shell: bash
        run: python scripts/check-version.py "${GITHUB_REF_NAME}"
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke test compiled binary
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/sq"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="${binary}.exe"; fi
          "$binary" --version
          "$binary" providers
      - run: python scripts/package-release.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: sq-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --project python --out-dir dist -q
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdk
          path: dist/*
          if-no-files-found: error
  publish:
    needs: [binary, sdk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: python scripts/checksums.py dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "sq $GITHUB_REF_NAME" --notes-file docs/release-notes.md
